<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ディベート大会 結果速報</title>
  <style>
    :root {
      --navy: #17324d;
      --blue: #2864a5;
      --accent: #2563eb;
      --bg: #f4f7fa;
      --card-bg: #ffffff;
      --border: #d9e2ec;
      --text: #253449;
      --text-sub: #68788a;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", Meiryo, sans-serif;
      padding: 24px 16px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: #fff;
      padding: 24px 28px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(23, 50, 77, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .last-update {
      font-size: 0.85rem;
      color: #d7e8fa;
    }

    .refresh-btn {
      background: #fff;
      color: var(--navy);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .refresh-btn:hover {
      background: #f1f5f9;
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    .refresh-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    /* タブ切り替えバー */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    /* コンテンツ表示エリア */
    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .tab-panel.active {
      display: flex;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card-title {
      background: #f8fafc;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-body {
      padding: 16px 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* ローディングスピナー */
    .loader {
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <main>
    <header>
      <div>
        <h1>ディベート大会 結果速報</h1>
      </div>
      <div class="header-controls">
        <span class="last-update" id="lastUpdateText">最終取得: --:--:--</span>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">
          <span id="refreshIcon">🔄</span> 最新状態に更新
        </button>
      </div>
    </header>

    <!-- タブメニュー -->
    <nav class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('match1')">第1試合（予選2グループ）</button>
      <button class="tab-btn" onclick="switchTab('match2')">第2試合（3位決定戦）</button>
      <button class="tab-btn" onclick="switchTab('match3')">第3試合（決勝戦）</button>
      <button class="tab-btn" onclick="switchTab('mvp')">MVP投票結果</button>
    </nav>

    <!-- タブ1: 第1試合（2グループ同時進行） -->
    <div id="panel-match1" class="tab-panel active">
      <div class="result-card">
        <div class="card-title">グループA 対戦結果</div>
        <div class="card-body" id="match1-groupA-content">
          <div class="loader">データを読み込み中...</div>
        </div>
      </div>

      <div class="result-card">
        <div class="card-title">グループB 対戦結果</div>
        <div class="card-body" id="match1-groupB-content">
          <div class="loader">データを読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- タブ2: 第2試合（3位決定戦） -->
    <div id="panel-match2" class="tab-panel">
      <div class="result-card">
        <div class="card-title">3位決定戦 結果</div>
        <div class="card-body" id="match2-content">
          <div class="loader">データを読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- タブ3: 第3試合（決勝戦） -->
    <div id="panel-match3" class="tab-panel">
      <div class="result-card">
        <div class="card-title">決勝戦 結果</div>
        <div class="card-body" id="match3-content">
          <div class="loader">データを読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- タブ4: MVP投票 -->
    <div id="panel-mvp" class="tab-panel">
      <div class="result-card">
        <div class="card-title">MVP 投票集計</div>
        <div class="card-body" id="mvp-content">
          <div class="loader">データを読み込み中...</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // タブ切り替え処理
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('panel-' + tabId).classList.add('active');
    }

    // テーブル生成ヘルパー
    function renderTable(containerId, tableData) {
      const container = document.getElementById(containerId);
      if (!tableData || !tableData.rows || tableData.rows.length === 0) {
        container.innerHTML = '<div class="empty-state">まだデータが登録されていません。</div>';
        return;
      }

      let html = '<table><thead><tr>';
      tableData.headers.forEach(h => {
        html += `<th>${h}</th>`;
      });
      html += '</tr></thead><tbody>';

      tableData.rows.forEach(row => {
        html += '<tr>';
        row.forEach(cell => {
          html += `<td>${cell !== "" ? cell : "-"}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // スプレッドシートからデータ取得
    function fetchData() {
      const btn = document.getElementById('refreshBtn');
      const icon = document.getElementById('refreshIcon');
      btn.classList.add('loading');
      icon.textContent = '⏳';

      google.script.run
        .withSuccessHandler(function(data) {
          btn.classList.remove('loading');
          icon.textContent = '🔄';
          document.getElementById('lastUpdateText').textContent = `最終取得: ${data.updatedAt}`;

          // 各エリアにレンダリング
          renderTable('match1-groupA-content', data.match1?.groupA);
          renderTable('match1-groupB-content', data.match1?.groupB);
          renderTable('match2-content', data.match2);
          renderTable('match3-content', data.match3);
          renderTable('mvp-content', data.mvp);
        })
        .withFailureHandler(function(err) {
          btn.classList.remove('loading');
          icon.textContent = '⚠️';
          alert('データの取得に失敗しました: ' + err.message);
        })
        .getDebateResults();
    }

    // 初回読み込み
    window.onload = function() {
      fetchData();
    };
  </script>
</body>
</html>
